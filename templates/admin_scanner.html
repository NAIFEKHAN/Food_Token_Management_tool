{% extends "base.html" %}
{% block title %}QR Scanner | {{ event_name }}{% endblock %}
{% block body %}
<nav class="navbar navbar-dark bg-black px-3">
  <a class="navbar-brand" href="/admin/dashboard">{{ event_name }} · Admin</a>
  <a class="btn btn-outline-gold btn-sm" href="/admin/dashboard">← Dashboard</a>
</nav>
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card card-dark p-3">
        <h5 class="text-warning text-center mb-3">Scan Food Token</h5>
        <div id="reader" style="width: 100%;"></div>
        <div id="result" class="mt-3"></div>
        <button id="reset" class="btn btn-outline-gold w-100 mt-2">Scan Next</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="/static/js/admin_scanner.js"></script>
{% endblock %}
